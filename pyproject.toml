[project]
name = "personal-finance-coach-agent"
version = "0.1.0"
description = "AI-powered personal finance coach with RAG, LangGraph, and investment goal correlation"
requires-python = ">=3.11"
dependencies = [
    # LLM — Vertex AI
    "anthropic[vertex]>=0.40.0",
    "langchain-google-vertexai>=2.0.0",
    "google-cloud-aiplatform>=1.70.0",

    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",

    # RAG & Vector store
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.50.0",

    # Document ingestion
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",

    # Gmail
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Utils
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "httpx>=0.27.0",
    "python-semantic-release>=9.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Release automation (python-semantic-release) ────────────────────────────────
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true
build_command = ""
commit_message = "chore(release): v{version} [skip ci]\n\n{changelog}"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    '''^chore\(release\):.*''',
    '''^Merge pull request.*''',
    '''^Merge branch.*''',
]

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "docs", "chore", "refactor", "test", "ci", "build", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
type = "github"